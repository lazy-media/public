#########################################################################
##### This Docker Compose File uses the env file for all variables. #####
#########################################################################

services:
    web:
        image: jitsi/web:${RELEASE_VERSION}
        restart: unless-stopped
        ports:
            - '8001:80'
            - '8443:443'
        volumes:
            - ${CONFIG}/web:/config:Z
            - ${CONFIG}/web/crontabs:/var/spool/cron/crontabs:Z
            - ${CONFIG}/transcripts:/usr/share/jitsi-meet/transcripts:Z
        env_file: .env
        networks:
            meet.jitsi:
        depends_on:
            - jvb

    prosody:
        image: jitsi/prosody:${RELEASE_VERSION}
        restart: unless-stopped
        expose:
            - '5222'
            - '5269'
            - '5347'
            - '5280'
        volumes:
            - ${CONFIG}/prosody/config:/config:Z
        env_file: .env
        networks:
            meet.jitsi:
                aliases:
                    - xmpp.meet.lazymedia.media

    jicofo:
        image: jitsi/jicofo:${RELEASE_VERSION}
        restart: unless-stopped
        volumes:
            - ${CONFIG}/jicofo:/config:Z
        env_file: .env
        depends_on:
            - prosody
        networks:
            meet.jitsi:

    jvb:
        image: jitsi/jvb:${RELEASE_VERSION}
        restart: unless-stopped
        ports:
            - '10001:10001/udp'
            - '8080:8080'
        volumes:
            - ${CONFIG}/jvb:/config:Z
        env_file: .env
        depends_on:
            - prosody
        networks:
            meet.jitsi:

    jibri:
        image: jitsi/jibri:${RELEASE_VERSION}
        restart: unless-stopped
        volumes:
            - ${CONFIG}/jibri:/config:Z
            - ${CONFIG}/jibri/recordings:/recordings:Z
        shm_size: '2gb'
        cap_add:
            - SYS_ADMIN
        env_file: .env
        depends_on:
            - jicofo
        networks:
            meet.jitsi:
           
    jigasi:
        image: jitsi/jigasi:${RELEASE_VERSION}
        restart: unless-stopped
        ports:
            - '${JIGASI_PORT_MIN:-20000}-${JIGASI_PORT_MAX:-20050}:${JIGASI_PORT_MIN:-20000}-${JIGASI_PORT_MAX:-20050}/udp'
        volumes:
            - ${CONFIG}/jigasi:/config:Z
        env_file: .env
        depends_on:
            - prosody
        networks:
            meet.jitsi:

networks:
    meet.jitsi: