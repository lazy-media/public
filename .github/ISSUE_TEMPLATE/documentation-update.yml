name: "📚 Public Documentation Update"
description: "Request an update or improvement to the documentation."
title: "[Public Docs Update] "
labels: ["documentation", "gitbook", "update", "needs triage"]
assignees: "lazy-media"
body:
  - type: dropdown
    id: issue-verification
    attributes:
      label: "Is there an issue, or pull request already open for this?"
      description: "Please check to make sure there is not already a pull request or an issue open for this before posting."
      options:
        - "Yes"
        - "No"
    validations:
      required: true
      
  - type: dropdown
    id: doc-section
    attributes:
      label: "Which section of the documentation needs to be updated?"
      description: "Select the main area or section that your update relates to."
      options:
        - "Artificial-Intelligence: Faster Whisper"
        - "Artificial-Intelligence: Ollama"
        - "Artificial-Intelligence: Open WebUI"
        - "Artificial-Intelligence: Piper"
        - "Artificial-Intelligence Stable Diffusion"
        - "Authentik: Applications & Providers"
        - "Authentik: Authentik Installation"
        - "Authentik: Basic HTTP Authentication"
        - "Authentik: Cloudflare Zero Trust"
        - "Authentik: Default Authentik Flows"
        - "Authentik: Discord"
        - "Authentik: Federation & Social Login"
        - "Authentik: Gitlab"
        - "Authentik: Grafana"
        - "Authentik: Immich"
        - "Authentik: Jellyfin"
        - "Authentik: Jitsi Meet"
        - "Authentik: Kasm"
        - "Authentik: Mastodon"
        - "Authentik: Nextcloud"
        - "Authentik: Paperless NGX"
        - "Authentik: Portainer"
        - "Authentik: Prometheus"
        - "Authentik: RocketChat"
        - "Authentik: Uptime Kuma"
        - "Authentik: Vaultwarden"
        - "Authentik: Vikunja"
        - "Authentik: Wiki.JS"
        - "Bitcoin: Miners"
        - "Bitcoin: Wallets"
        - "CalCom-Appointment-Scheduling: Installation"
        - "Docker: Dockerfiles"
        - "Docker: Installation"
        - "Docker: Portainer"
        - "Google-Photos-Takeout: Google Photo Takeout Helper"
        - "Google-Photos-Takeout: Immich Go"
        - "Mailcow: Installation"
        - "Mastodon: Installation"
        - "My-Homelab: Personal PC"
        - "My-Homelab: Servers"
        - "Nextcloud: Installation"
        - "Reactive-Resume: Installation"
        - "TrueNas-Scale: LSI 9300 16i HBA"
        - "Vikunja: Mobile Application"
    validations:
      required: true

  - type: dropdown
    id: change-type
    attributes:
      label: "Type of documentation update"
      description: "Choose the type of update you are requesting."
      options:
        - "Correction (fix typo, error, outdated content)"
        - "Clarification (improve wording or explanation)"
        - "Addition (add new content or example)"
        - "Removal (delete incorrect or obsolete content)"
        - "Reorganization (move or restructure docs)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the documentation update"
      description: "Provide a clear and detailed description of what needs to be changed, added, or improved. Include specific file names or URLs if known."
      placeholder: "Example: The configuration section is missing an explanation for the 'theme' option in config.yml."
    validations:
      required: true

  - type: markdown
    id: replacement
    attributes:
      label: "How would you like the documentation to read instead?"
      description: "Please provide the exact text you'd like to update on the Docs Site, ensuring it is clear, concise, and thoroughly detailed. For optimal compatibility, submit this content in Markdown format."
      placeholder: "Please input your extremely detailed documentation replacement here. Must be in Markdown Format."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Additional context or screenshots (optional)"
      description: "Add any other context, screenshots, or relevant details that might help us understand your request."

  - type: checkboxes
    id: self-check
    attributes:
      label: "Self-check"
      description: "Please confirm the following before submitting:"
      options:
        - label: "I have searched existing issues to avoid duplicates."
          required: true
        - label: "The requested change is relevant to the Lazy Media Public Docs."
          required: true
        - label: "I have written the updated documentation in markdown format."
          required: true
