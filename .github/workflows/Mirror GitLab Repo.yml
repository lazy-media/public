name: Mirror GitLab Repository

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
      timezone: 'America/Los_Angeles'
  workflow_dispatch:     # Allows manual triggering

jobs:
  mirror:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout GitHub repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITH_TOKEN_MIRROR }}

    - name: Mirror from GitLab
      run: |
        # Configure git identity
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Save the .github directory temporarily
        if [ -d .github ]; then
          mv .github ../.github-backup
        fi
        
        # Remove all existing files except .git
        if [ -d .git ]; then
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
        fi

        # Add GitLab remote
        git remote add gitlab ${{ secrets.GITLAB_REPO_URL }}
        
        # Fetch all from GitLab
        git fetch --all --prune
        
        # Reset to GitLab's default branch (assuming it's 'main')
        git reset --hard gitlab/main
        
        # Restore the .github directory
        if [ -d ../.github-backup ]; then
          rm -rf .github  # Remove if it exists from GitLab
          mv ../.github-backup .github
        fi
        
        # Commit the restored .github directory if it changed
        if [ -d .github ]; then
          git add .github
          git commit -m "${{ secrets.COMMIT_MESSAGE }}"
        fi
        
        # Push to GitHub using the token
        git push --force origin ${{ secrets.GITH_BRANCH }}
