name: Mirror GitHub to GitLab

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
      timezone: 'America/Los_Angeles'
  workflow_dispatch:     # Allows manual triggering

jobs:
  mirror:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout GitHub repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITH_TOKEN_MIRROR }}

    - name: Mirror to GitLab
      run: |
        # Configure git identity
        git config --global user.name "${{ secrets.GIT_AUTHOR_NAME }}"
        git config --global user.email "${{ secrets.GIT_AUTHOR_EMAIL }}"
        
        # Add GitLab remote with authentication token
        git remote add gitlab https://oauth2:${{ secrets.GITL_TOKEN }}@${{ secrets.GITLAB_REPO_URL }}
        
        # Fetch all from GitLab
        git fetch --all --prune
        
        # Push to GitLab's default branch (assuming it's 'main')
        git push --force gitlab ${{ secrets.GITH_BRANCH }}:main
